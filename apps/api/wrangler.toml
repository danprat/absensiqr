name = "absensiqr-api"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
APP_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:5173"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"

# Development environment
[env.development]
name = "absensiqr-api-dev"
vars = { ENVIRONMENT = "development" }

# Staging environment
[env.staging]
name = "absensiqr-api-staging"
vars = { ENVIRONMENT = "staging" }

# Production environment
[env.production]
name = "absensiqr-api-production"
vars = { ENVIRONMENT = "production" }

# R2 bucket binding (for file storage)
# [[r2_buckets]]
# binding = "ASSETS_BUCKET"
# bucket_name = "absensiqr-assets"

# Queue binding (for export jobs)
# [[queues.producers]]
# binding = "EXPORT_QUEUE"
# queue = "absensiqr-export-jobs"

# Note: Set these secrets using wrangler secret put:
# wrangler secret put DATABASE_URL
# wrangler secret put JWT_SECRET
# wrangler secret put RESEND_API_KEY
